name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --editable .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Fictional demo
        run: draftops process examples/tickets.jsonl --policy examples/policy.json --predictions examples/recorded-predictions.json --out .tmp/demo-run
      - name: Confirm no original fictional PII reached artifacts
        shell: bash
        run: |
          if grep -R "alex@example.invalid\|23456789\|ORD-10420" .tmp/demo-run; then
            exit 1
          fi
